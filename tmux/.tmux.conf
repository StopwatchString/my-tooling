# ~/.tmux.conf

# Clear all default bindings in the prefix table
unbind -a -T prefix

# Set prefix to Ctrl+Space
set -g prefix C-Space
bind C-Space send-prefix

# Allow mouse controls
set -g mouse on

# Move between panes (leader + hjkl)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Create new pane in a direction (leader + Ctrl+hjkl)
bind C-h split-window -h -b
bind C-l split-window -h
bind C-k split-window -v -b
bind C-j split-window -v

# Resize pane (leader + Alt+hjkl)
bind M-h resize-pane -L 5
bind M-j resize-pane -D 5
bind M-k resize-pane -U 5
bind M-l resize-pane -R 5

# Window navigation (leader + Ctrl-m / Ctrl+n)
bind C-m next-window
bind C-n previous-window

# Jump to numbered window
bind 0 select-window -t 0
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# Detach
bind d detach-client

# Help
bind ? list-keys

# Pickers / switchers
bind w choose-tree -w
bind s choose-tree -s

# Rename
bind , command-prompt -I "#W" "rename-window '%%'"
bind $ command-prompt -I "#S" "rename-session '%%'"

# Break pane into new window
bind ! break-pane

# Clock
bind t clock-mode

# Show messages
bind '~' show-messages

# Misc
bind : command-prompt
bind [ copy-mode
bind ] paste-buffer
bind x confirm-before -p "kill pane? (y/n)" kill-pane
bind z resize-pane -Z
bind c new-window




# --- Minimal grey theme ---
# Bar uses the terminal's own background; only text is grey.
set -g status-style "bg=default,fg=colour244"

# Left: session name
set -g status-left-length 30
set -g status-left "#[fg=colour246] #S  "

# Right: time only
set -g status-right "#[fg=colour242]%H:%M "

# Window list: current window is slightly brighter, nothing else changes
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-style "fg=colour240"
set -g window-status-current-style "fg=colour250"

# Override defaults that use reverse video (bright blocks)
set -g window-status-activity-style "fg=colour246,underscore"
set -g window-status-bell-style "fg=colour250,underscore"
set -g monitor-activity off

# Command prompt and messages
set -g message-style "bg=default,fg=colour250"
set -g message-command-style "bg=default,fg=colour250"

# Pane borders
set -g pane-border-style "fg=colour236"
set -g pane-active-border-style "fg=colour240"

# Copy-mode selection and clock
set -g mode-style "bg=colour238,fg=default"
set -g clock-mode-colour colour244
