# User-level clangd config. setup.sh joins it with downstream layers' copies
# (one YAML document each, applied in order) into:
#   Linux: ~/.config/clangd/config.yaml
#   macOS: ~/Library/Preferences/clangd/config.yaml
# Project .clangd files override this.
# Reference: https://clangd.llvm.org/config

CompileFlags:
  Add: [-Wall, -Wextra]

Diagnostics:
  UnusedIncludes: Strict

InlayHints:
  Enabled: true
  ParameterNames: true
  DeducedTypes: true
